<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>Cannon Balls 3D</title>

    <script>
        // 1. Neutralize specific variables
        window.famobi_gameID = "cannon-balls-3d";
        window.famobi_isPaused = false;
        window.famobi_hasMutedAudio = false; // <-- SOUND FIX
        
        window.isForcedMode = function() { return false; }; 
        window.skipTitleScreen = function() { return false; };
        window.isExternalStart = function() { return false; }; 
        
        // 2. The Smart Proxy (Ad Skipper)
        const silentProxy = new Proxy(function() {}, {
            get: function(target, prop) {
                // Prevent Math crashes
                if (prop === Symbol.toPrimitive || prop === 'valueOf') return function() { return 0; };
                if (prop === 'getSafeArea') return function() { return {top:0, left:0, bottom:0, right:0}; };
                
                // Audio fixes
                if (prop === 'getVolume') return function() { return 1; }; 
                if (prop === 'isMuted') return function() { return false; };
                if (prop === 'hasAudio') return function() { return true; };

                // Promise catches
                if (prop === 'then') return function(cb) { if (cb) cb(); return silentProxy; };
                if (prop === 'catch' || prop === 'finally') return function() { return silentProxy; };
                if (prop === 'hasFeature') return function() { return false; }; 
                if (prop === 'isReady') return function() { return true; };
                return silentProxy;
            },
            apply: function(target, thisArg, argList) {
                // NEW FIX: The Ad-Skipper! 
                // If the game passes a callback (like "start next level"), fire it immediately.
                for (let i = 0; i < argList.length; i++) {
                    if (typeof argList[i] === 'function') {
                        setTimeout(argList[i], 10); // Run the callback safely
                    }
                }
                return silentProxy; 
            }
        });
    </script>
</head>
<body>
    <div id="application-container"></div>

    <script src="playcanvas-stable.min.js"></script>

    <script>
        if (window.pc && pc.Application) {
            pc.Application.prototype.getFamobiAdjustedCanvasSize = function() {
                return { width: window.innerWidth, height: window.innerHeight };
            };
        }
    </script>

    <script src="__settings__.js"></script>
    <script src="__modules__.js"></script>
    <script src="__start__.js"></script>
    <script src="__loading__.js"></script>
</body>
</html>
