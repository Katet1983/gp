    (function() {
        // 1. Unbreakable Crypto Polyfill
        const fakeUUID = function() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };
        try { if (typeof Crypto !== 'undefined' && !Crypto.prototype.randomUUID) Crypto.prototype.randomUUID = fakeUUID; } catch(e) {}
        try { if (typeof window.crypto !== 'undefined' && !window.crypto.randomUUID) Object.defineProperty(window.crypto, 'randomUUID', { value: fakeUUID, writable: true }); } catch(e) {}

        // 2. AudioContext Autoplay Polyfill
        const audioCtxs = [];
        const OrigAudioContext = window.AudioContext || window.webkitAudioContext;
        if (OrigAudioContext) {
            window.AudioContext = function(...args) {
                const ctx = new OrigAudioContext(...args);
                audioCtxs.push(ctx);
                return ctx;
            };
            window.AudioContext.prototype = OrigAudioContext.prototype;
        }
        window.addEventListener('click', () => { audioCtxs.forEach(ctx => { if (ctx.state === 'suspended') ctx.resume(); }); }, { once: true });

        // 3. UI Unblocker
        const removeLoaders = () => {
            const loaders = document.querySelectorAll('#loader, .loader, #loading, .loading-screen');
            loaders.forEach(l => l.style.display = 'none');
        };

        // 4. SDK Mocks (With Adblock Validation Payload)
        const fakePoki = {
            init: () => Promise.resolve({ adBlock: false }), // Critical handshake for MotoX3M
            gameLoadingStart: () => {}, gameLoadingProgress: () => {}, 
            gameLoadingFinished: () => { removeLoaders(); }, gameInteractive: () => { removeLoaders(); }, 
            gameplayStart: () => {}, gameplayStop: () => {}, customEvent: () => {}, 
            commercialBreak: () => Promise.resolve(), rewardedBreak: () => Promise.resolve(true),
            displayAd: () => {}, destroyAd: () => {}, getURLParam: () => "", setDebug: () => {}
        };
        try { Object.defineProperty(window, 'PokiSDK', { get: () => fakePoki, set: () => {} }); } catch(e) {}
        window.initPokiBridge = function() {};

        window.addEventListener('click', removeLoaders);

        // 5. DOM Interceptor
        const blockScript = function(el) {
            if (el && el.tagName === 'SCRIPT' && el.src) {
                const s = el.src.toLowerCase();
                if (s.includes('poki') || s.includes('crazy') || s.includes('pksl') || s.includes('sitelock')) {
                    setTimeout(() => { if(el.onload) el.onload(); }, 10);
                    return true;
                }
            }
            return false;
        };
        const origAppend = Element.prototype.appendChild;
        Element.prototype.appendChild = function(el) { return blockScript(el) ? el : origAppend.call(this, el); };
        const origInsert = Element.prototype.insertBefore;
        Element.prototype.insertBefore = function(el, ref) { return blockScript(el) ? el : origInsert.call(this, el, ref); };

        // 6. Network Sandbox
        const origFetch = window.fetch;
        window.fetch = async function(...args) {
            const url = typeof args[0] === 'string' ? args[0] : (args[0] ? args[0].url : '');
            if (url && (url.includes('poki-sdk') || url.includes('pksl') || url.includes('sitelock') || url.includes('analytics'))) {
                return new Response("console.log('Blocked SDK');", {status: 200, headers: {'Content-Type': 'application/javascript'}});
            }
            return origFetch.apply(this, args);
        };
        const origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            this._archiver_url = url;
            return origOpen.call(this, method, url, ...rest);
        };
        const origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function(...args) {
            if (this._archiver_url && typeof this._archiver_url === 'string') {
                const u = this._archiver_url.toLowerCase();
                if (u.includes('poki-sdk') || u.includes('pksl') || u.includes('sitelock')) {
                    Object.defineProperty(this, 'responseText', {value: "console.log('Blocked SDK');"});
                    Object.defineProperty(this, 'status', {value: 200});
                    Object.defineProperty(this, 'readyState', {value: 4});
                    if (this.onreadystatechange) this.onreadystatechange();
                    if (this.onload) this.onload();
                    return;
                }
            }
            return origSend.apply(this, args);
        };

        window.open = function() { return null; };
    })();
    </script>

<script id="engine-setup" type="text/javascript">
    var extra_params = {
        archive_location_filter: function (path) {
            return ("archive" + path + "");
        },
        engine_arguments: ["--verify-graphics-calls=false",],
        custom_heap_size: 134217728,
        full_screen_container: "#canvas-container",
        disable_context_menu: true
    }

    Module['INITIAL_MEMORY'] = extra_params.custom_heap_size;

    Module['onRuntimeInitialized'] = function () {
        Module.runApp("canvas", extra_params);
    };

    Module["locateFile"] = function (path, scriptDirectory) {
        if (path == "dmengine.wasm" || path == "dmengine_release.wasm" || path == "dmengine_headless.wasm") {
            path = "MonkeyMart.wasm";
        }
        return scriptDirectory + path;
    };

    var is_iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var buttonHeight = 0;
    var prevInnerWidth = -1;
    var prevInnerHeight = -1;

    function resize_game_canvas() {
        // Hack for iOS when exit from Fullscreen mode
        if (is_iOS) {
            window.scrollTo(0, 0);
        }
        var app_container = document.getElementById('app-container');
        var game_canvas = document.getElementById('canvas');
        var progress_bar_root = document.getElementById('progress-bar-root');
        var progress_bar_fg = document.getElementById('progress-bar-fg');
        var progress_bar_bg = document.getElementById('progress-bar-bg');
        var innerWidth = window.innerWidth;
        var innerHeight = window.innerHeight - buttonHeight;
        if (prevInnerWidth == innerWidth && prevInnerHeight == innerHeight) {
            return;
        }
        prevInnerWidth = innerWidth;
        prevInnerHeight = innerHeight;
        var width = 960;
        var height = 640;
        var targetRatio = width / height;
        var actualRatio = innerWidth / innerHeight;
        //Stretch
        width = innerWidth;
        height = innerHeight;
        app_container.style.width = width + "px";
        app_container.style.height = height + buttonHeight + "px";
        game_canvas.width = width;
        game_canvas.height = height;
        // progress bar
        var bar_h = width < height ? width : height;
        progress_bar_bg.width = Math.min(Math.ceil(bar_h * 0.06 * 300 / 24), width * 0.8);

        progress_bar_bg.style.marginLeft = -progress_bar_bg.width / 2 + "px";
        progress_bar_fg.width = Math.ceil(progress_bar_bg.width * 1);

        progress_bar_fg.style.marginTop = (progress_bar_bg.width * 0) * (0) / 2 + "px";
        progress_bar_fg.style.marginLeft = -progress_bar_bg.width / 2 - progress_bar_fg.width / 2 + "px";
        // progress_bar_text.style.fontSize = Math.ceil(bar_h * 0.10) + "px";
        progress_bar_root.style.bottom = Math.ceil(height * 0.08 + buttonHeight) + "px";
    }

    resize_game_canvas();
    window.addEventListener('resize', resize_game_canvas, false);
    window.addEventListener('orientationchange', resize_game_canvas, false);
    // window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
    window.addEventListener("keydown", function (e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
            e.preventDefault();
        }
    }, false);
    window.addEventListener('focus', resize_game_canvas, false);

        // Delete all LiveUpdate files stored in IDBFS

        var resDir = _HashSHA1("MonkeyMart");
        try {
            FS.unlink(dir + "/." + resDir + "/liveupdate.arcd");

<script id="engine-start" type="text/javascript">
    var currentPercentage = 0

    Progress.updateProgress = function (percentage) {
        Progress.notifyListeners(percentage);
        if (currentPercentage > percentage) {
            percentage = currentPercentage
        }
        currentPercentage = percentage
        var fg = document.getElementById('progress-bar-fg');
        fg.style.clip = "rect(0px," + fg.width * percentage / 100 + "px," + fg.height + "px," + "0px)"

        if (isNaN(percentage)) {
            var progress_bar_root = document.getElementById('progress-bar-root');
            progress_bar_root.style.visibility = "hidden";
        }
    };
    Progress.addProgress = function () {
        var progress_bar_root = document.getElementById('progress-bar-root');
        progress_bar_root.style.visibility = "visible"
    }
    Progress.removeProgress = function () {
        var progress_bar_root = document.getElementById('progress-bar-root');
        progress_bar_root.style.visibility = "hidden";
        Module.canvas.style.background = "";
    }

    EngineLoader.stream_wasm = "false" === "true";
    EngineLoader.load("canvas", "MonkeyMart");
</script>
