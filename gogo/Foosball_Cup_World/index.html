	<script>
		

        window.getlocale = function () {
            return (navigator.language || navigator.userLanguage || "en")
                .slice(0, 2)
                .toLowerCase();
        };

		window.sendScore = function (score) {
		    if (GSInstant?.setScoreAsync) {
		        GSInstant.setScoreAsync(score).then(info => console.log("Score sent:", info));
		    }
		};



	</script>


	<script>
        var globalSound = true;
	    window.GameReady = function () {
	        GameSnacks?.game.ready();
			if (!GameSnacks?.audio.isEnabled()) {
                globalSound = false;
                stopMusicSdk();
			}
	    };

		window.showAdReward = function () {
		    GameSnacks?.ad.break({
		        type: 'reward',
		        name: 'reward_bullets',


		        beforeAd: () => {
                    stopMusicSdk();
		        },
		        
		        beforeReward: (showAdFn) => {
		            showAdFn();
		        },
		        
		        adViewed: () => {
		            c3_callFunction('AdComplete');
		        },

		        adDismissed: () => {
		            c3_callFunction('AdSkipped');
		        },


		        afterAd: () => {
		            playMusicSdk();
		        },

		        adBreakDone: (info) => {
		            console.log("Reward ad info:", info);
		        }
		    });
		};

		window.showInterstitialAd = function () {
		    GameSnacks?.ad.break({
		        type: 'next',
		        name: 'level_interstitial',

		        beforeAd: () => {
		            stopMusicSdk();
		        },

		        afterAd: () => {
		            playMusicSdk();
		        },

		        adBreakDone: (info) => {
		            console.log("Interstitial ad info:", info);
		        }
		    });
		};

	    window.updateScore = function (val) {
            console.log('Score:', val);
	        GameSnacks?.score.update(val);
	    };

	    window.levelCompleted = function (level) {
	        GameSnacks?.game.levelComplete(level);
	    };

	    window.gameOver = function () {

	        GameSnacks?.game.gameOver();
	    };

	    window.setItem = function (key, value) {
			const encoded = btoa(JSON.stringify(value));
	        GameSnacks?.storage.setItem(key, encoded);
	    };

		window.getItem = async function (key) {
		    try {
		        let value = await GameSnacks?.storage.getItem(key);
		        if (value === null || value === undefined) {
		            value = null;
		        }
		        return JSON.parse(atob(value));
		    } catch (e) {
		        return null;
		    }
		};


		document.addEventListener("DOMContentLoaded", function () {

		    GameSnacks?.game.firstFrameReady();

		    GameSnacks?.game.onPause(() => {
		        stopMusicSdk();
		    });

		    GameSnacks?.game.onResume(() => {
		        playMusicSdk();
		    });

		    GameSnacks?.audio.subscribe(isOn => {
                globalSound = isOn;

                if(globalSound) {
                    playMusicSdk();
                } else {
                    stopMusicSdk();
                }
		    });

		});
        
	</script>
