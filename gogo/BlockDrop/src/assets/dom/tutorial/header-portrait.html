<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <meta name="viewport"
    content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width" />
  <title>How to play</title>
  <!-- <link href="landscpae.css" rel="stylesheet" /> -->
  <style>
  

    #tentris-howtoplay-relative-container-p {
      position: relative;
    }

    #tentris-howtoplay-close-button-p {
      max-width: 28px;
      max-height: 23px;
      position: absolute;
      top: 10px;
      right: 24px;
    }

    #tentris-howtoplay-wrapper-popup-p {
      display: flex;
      height: 100%;
      min-height: 100%;

      position: relative;
    }

    #tentris-howtoplay-howtoplay-popup-p {
      width: 447px;
      height: 804px;
      background-repeat: no-repeat;
      background-size: contain;
      position: relative;
    }

    #tentris-howtoplay-title-p {
      font-size: 37.5px;
      text-align: center;
      font-family: "Montserrat-SemiBold";
      color: #fff;
      margin-top: 50px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    #tentris-howtoplay-content-wrapper-p {
      padding: 30px 0px 20px 0px;
    }

    #howtoplay-title-p {
      font-size: 24px;
      color: #fff;
      font-family: "Montserrat-SemiBold";
      margin-top: 30px;
    }

    #wrapper-backbutton-howtoplay-p {
      display: flex;
      justify-content: space-evenly;
      margin: 30px auto;
      width: 70%;
      position: absolute;
      bottom: 0px;
      left: 0px;
      right: 0px;
    }

    #left-arrow-p {
      width: 64px;
      height: 64px;
    }

    #right-arrow-p {
      width: 64px;
      height: 64px;
    }

    #indicator-p-1 {
      align-self: center;
      width: 12px;
      height: 12px;
      margin: 5px 7px;

    }
    #indicator-p-2 {
      align-self: center;
      width: 12px;
      height: 12px;
      margin: 5px 7px;

    }
    #indicator-p-3 {
      align-self: center;
      width: 12px;
      height: 12px;
      margin: 5px 7px;

    }

    .dots-howtoplay-p {
      align-self: center;
      width: 12px;
      height: 12px;
      margin: 5px;
    }

    #howtoplay-indicator-wrapper-p {
      display: flex;
    }

    #tentris-howtoplay-close-button-p:hover, #tentris-howtoplay-close-button-p:active{
      opacity: 0.75;    
    }
  </style>
</head>

  <section id="tentris-howtoplay-wrapper-popup-p">
    <div id="tentris-howtoplay-wrapper-p">
      <div id="tentris-howtoplay-howtoplay-popup-p">
        <div id="tentris-howtoplay-content-wrapper-p">
          <div id="tentris-howtoplay-relative-container-p">
            <p id="tentris-howtoplay-title-p">How to play</p>
            <img id="tentris-howtoplay-close-button-p" src="./src/assets/art/svg/close_icon.svg" alt="close" name="close"/>
          </div>
          <!-- scores -->
          <!-- <div id="content-tutorial-p">
      

          </div> -->
          <div id="wrapper-backbutton-howtoplay-p">
            <img id="left-arrow-p" src="./src/assets/art/svg/howToPlay_backArrow_P_01.svg" name="left" />
            <div id="howtoplay-indicator-wrapper-p">
              <img class="dots-howtoplay-p" id="indicator-p-1" src="./src/assets/art/svg/howToPlay_selected_P_01.svg" />
              <img class="dots-howtoplay-p" id="indicator-p-2" src="./src/assets/art/svg/howToPlay_selected_P_01.svg" />
              <img class="dots-howtoplay-p" id="indicator-p-3" src="./src/assets/art/svg/howToPlay_selected_P_01.svg" />
            </div>
            <!-- <p id="dots-howtoplay-p-p"></p> -->
            <img id="right-arrow-p" src="./src/assets/art/svg/howToPlay_nextArrow_P_01.svg" name="right" />
          </div>
        </div>
      </div>
    </div>
  </section>

</html>
