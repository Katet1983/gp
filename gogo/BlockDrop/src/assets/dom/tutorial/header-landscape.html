  <style>
  
    #tentris-howtoplay-relative-container-l {
      position: relative;
    }

    #tentris-howtoplay-close-button-l {
      max-width: 28px;
      max-height: 23px;
      position: absolute;
      top: 0px;
      right: 30px;
    }

    #tentris-howtoplay-wrapper-popup-l {
      position: relative;
    }

    #tentris-howtoplay-howtoplay-popup-l {
      width: 804px;
      height: 482px;
      background-repeat: no-repeat;
      background-size: contain;
      position: relative;
    }

    #tentris-howtoplay-title-l {
      font-size: 37.5px;
      text-align: center;
      font-family: "Montserrat-SemiBold";
      color: #fff;
      margin-top: 0px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    #tentris-howtoplay-content-wrapper-l {
      padding: 30px 0px 20px 0px;
    }

    #tentris-howtoplay-button-wrapper-l {
      display: flex;
      margin-top: 25px;
      flex-direction: row;
    }

    #intruction-image-2-l {
      width: 379px;
      height: 331px;
    }

    #howtoplay-title-l {
      font-size: 24px;
      color: #fff;
      font-family: "Montserrat-SemiBold";
      margin-top: 30px;
    }


    #wrapper-backbutton-howtoplay-l {
      display: flex;
      justify-content: center;
      width: 50%;
      position: absolute;
      bottom: 50px;
      right: 20px;
    }

    #left-arrow-l {
      width: 64px;
      height: 64px;
    }

    #right-arrow-l {
      width: 64px;
      height: 64px;
    }

    #indicator-l-1 {
      align-self: center;
      width: 12px;
      height: 12px;
      margin: 5px 6px 5px 20px;

    }
    #indicator-l-2 {
      align-self: center;
      width: 12px;
      height: 12px;
      margin: 5px 6px;

    }
    #indicator-l-3 {
      align-self: center;
      width: 12px;
      height: 12px;
      margin: 5px 20px 5px 6px;

    }

    #howtoplay-indicator-wrapper-l {
      display: flex;
    }
    #tentris-howtoplay-close-button-l:hover, #tentris-howtoplay-close-button-l:active{
      opacity: 0.75;
    }

  <section id="tentris-howtoplay-wrapper-popup-l">

                <img id="indicator-l-1" src="./src/assets/art/svg/howToPlay_selected_P_01.svg" />
                <img id="indicator-l-2" src="./src/assets/art/svg/howToPlay_selected_P_01.svg" />
                <img id="indicator-l-3" src="./src/assets/art/svg/howToPlay_selected_P_01.svg" />
