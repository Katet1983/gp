<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <meta name="viewport"
    content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width" />
  <title>Settings</title>
  <!-- <link href="landscpae.css" rel="stylesheet" /> -->
  <style>
    *,
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    html {
      height: 100%;
    }

    body {
      background: #030b6d;
      height: 100%;
    }

    #tentris-gameover-relative-container {
      position: relative;
      margin-top: 20px;
    }

    #tentris-gameover-close-button {
      max-width: 28px;
      max-height: 23px;
      position: absolute;
      top: 0px;
      right: 20px;
      opacity: 0 !important;
    }

    #tentris-gameover-wrapper-popup {
      display: flex;
      align-items: center;
      height: 100%;
      min-height: 100%;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #tentris-gameover-setting-popup {
      background: url("./src/assets/art/svg/gameOver_bgPanel_P_L.svg");
      width: 447px;
      height: 453px;
      background-repeat: no-repeat;
      background-size: contain;
    }

    #tentris-gameover-title {
      font-size: 37.5px;
      text-align: center;
      font-family: "Montserrat-SemiBold";
      color: #fff;
      margin-top: 25px;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 20px;

    }

    #tentris-gameover-content-wrapper {
      /* padding: 30px 0px 20px 0px; */
      display: flex;
      justify-content: space-between;
      flex-direction: column;
      height: 100%;
    }

 

    #tentris-score-title {
      font-size: 30px;
      font-family: "Montserrat-Medium";
      text-align: center;
      margin-bottom: 10px;
      color: #fff;

    }

    #tentris-bestscore-title {
      font-size: 24px;
      font-family: "Montserrat-SemiBold";
      color: #bec2ff;
      text-align: center;
      margin-bottom: 10px;
      margin-top: 20px;
    }

    #tentris-gameover-play-again {
      outline: none;
      border: none;
      color: #fff;
      margin: 10px;
      font-size: 37px;
      font-family: "Montserrat-SemiBold";
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      z-index: 1;
    }

    #tentris-gameover-button-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      /* margin-top: 30px; */
    }


    .btn-hover {
      width: 333px;
      font-size: 37px;
      font-family: "Montserrat-SemiBold";
      text-transform: uppercase;

      color: #fff;
      cursor: pointer;
      margin: 20px;
      height: 71px;
      text-align: center;
      border: none;
      background-size: 300% 100%;
      border-radius: 50px;
      user-select: none;
    }

    .btn-hover.color-1 {
      background-image: linear-gradient(176deg, rgb(251, 0, 252), #c025d5 55%);
      box-shadow: 0px -3px 1px #f891ff,
        0px 3px 1px #c400d8,
        -1px 0px 1px #c400d8,
        1px 0px 1px #f891ff,
        0px 0px 10px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .btn-hover.color-1:hover {
      background-image: linear-gradient(176deg, #c025d5, rgb(231, 2, 232) 55%);
      box-shadow: 0px 1px 1px #f891ff, 0px -3px 1px #c400d8, -1px 0px 1px #c400d8, 1px 0px 1px #f891ff, 0px 0px 10px rgba(0, 0, 0, 0.3);
      user-select: none;
    }
    #tentris-gameover-close-button:hover , #tentris-gameover-close-button:active{
      opacity: 0.75;
    }

    #play-againtext {
      font-size: 37px;
      font-family: "Montserrat-Bold";
      text-transform: uppercase;
      text-align: center;
      color: #fff;
    }
    #home-text{
      font-size: 37px;
      font-family: "Montserrat-Bold";
      text-transform: uppercase;
      text-align: center;
      color: #fff;
    }
    .btn-wrapper{
      margin-bottom: 40px !important;
    }
  </style>
</head>

<body>
  <section id="tentris-gameover-wrapper-popup">
    <div id="tentris-gameover-wrapper">
      <div id="tentris-gameover-setting-popup">
        <div id="tentris-gameover-content-wrapper">
          <div id="tentris-gameover-relative-container">
            <p id="tentris-gameover-title">Out of Moves</p>
            <!-- <img id="tentris-gameover-close-button" src="./assets/art/svg/close_icon.svg" alt="close" name="close" /> -->
          </div>
          <div id="tentris-gameover-button-wrapper">            
            <p id="tentris-bestscore-title">Best score: 090923</p>
            <p id="tentris-score-title">Score: 9099</p>
          </div>
          <div id="tentris-gameover-button-wrapper" class="btn-wrapper">
            <!-- <button id="tentris-gameover-Home" class="btn-hover color-1" name="home">
            <p id="home-text">Home</p>
          </button> -->
          <button id="tentris-gameover-home" class="btn-hover color-1" name="home"
          class="btn-hover color-1">
          <p id="home-text">home</p>
        </button>
            <button id="tentris-gameover-play-again" class="btn-hover color-1" name="play-again"
              class="btn-hover color-1">
              <p id="play-againtext">Play Again</p>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script>

  </script>
</body>

</html>
