		}
		if(per >= 0.85 && per <= 1.15) {
			div.style.width = '100%';
			div.style.height = '100%';
		}
		else {
			div.style.width = gameWidth + 'px';
			div.style.height = gameHeight + 'px';
		}
	</script>
