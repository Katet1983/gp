<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width"
    />
    <title>Settings</title>
    <!-- <link href="landscpae.css" rel="stylesheet" /> -->
    <style>
    
      *,
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      html {
        height: 100%;
      }
      body {
        background: #323352;
        height: 100%;
      }
      #setting-relative-container-p {
        position: relative;
      }
      #settings-close-button-p {
        max-width: 51px;
        max-height: 51px;
        position: absolute;
        top: 0px;
        right: 20px;
        transition: all .2s ease-in-out; 
        opacity: 0;
      }
      #settings-close-button-p:hover { transform: scale(1.1); }
      #settings-wrapper-popup-p {
        display: flex;
        align-items: center;
        height: 100%;
        min-height: 100%;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      #settings-setting-popup-p {
        background-image: url("./src/assets/dom/settings_bg_P.svg"), linear-gradient( 50deg, #6fb6e1, #a1c1ca, #6fb6e1 100%) ;
        border-radius: 20px;
        /* background: url("./settings_bg_P.svg"); */
        width: 466px;
        height: 566px;
        background-repeat: no-repeat;
        background-size: contain;
      }
      #settings-title-p {
        font-size: 40px;
        text-align: center;
        font-family: "MPLUSRou-ExtraBold";
        color: #323352;
      }

      #settings-content-wrapper-p {
        padding: 16px 0px 20px 0px;
      }

      #settings-button-wrapper-p {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 55px;
        flex-direction: column;
      }
      #settings-howtoplay-buttons-p {
        height: 64px;
        border-radius: 32px;
        width: 248px;
        outline: none;
        border: none;
        background: #323251;
        color: #fff;
        margin: 10px 10px;
        font-size: 24px;
        font-family: "MPLUSRou-ExtraBold";
        user-select: none;
        transition: background-color 0.3s;
      }

      #settings-endgame-buttons-p {
        height: 64px;
        border-radius: 32px;
        width: 248px;
        outline: none;
        border: none;
        background: #323251;
        color: #fff;
        margin: 10px 10px;
        font-size: 24px;
        font-family: "MPLUSRou-ExtraBold";
        user-select: none;
        transition: background-color 0.3s;
      }

      #settings-archive-buttons-p {
        height: 64px;
        border-radius: 32px;
        width: 248px;
        outline: none;
        border: none;
        background: #323251;
        color: #fff;
        margin: 10px 10px;
        font-size: 24px;
        font-family: "MPLUSRou-ExtraBold";
        user-select: none;
        transition: background-color 0.3s;
      }

      #settings-on-sound-button-p {
        width: 92px;
        height: 43px;
        margin-bottom: 20px;
      }
      #settings-off-button-p {
        width: 92px;
        height: 43px;
        margin-bottom: 20px;
        display: none;
      }
      #settings-version-text-p {
        font-size: 18px;
        text-align: center;
        color: #323352;
        margin-top: 40px;
        font-family: "MPLUSRou-Bold";
      }

      #settings-howtoplay-buttons-p:hover,
      #settings-howtoplay-buttons-p:focus,
      #settings-howtoplay-buttons-p:active {
        background: #2a2b45;
      }
      #settings-endgame-buttons-p:hover,
      #settings-endgame-buttons-p:focus,
      #settings-endgame-buttons-p:active {
        background: #2a2b45;
      }
      #settings-archive-buttons-p:hover,
      #settings-archive-buttons-p:focus,
      #settings-archive-buttons-p:active {
        background: #2a2b45;
      }
    </style>
  </head>
  <body>
    <div id="settings-closebutton-wrapper-p"></div>
    <section id="settings-wrapper-popup-p">
      <div id="settings-wrapper-p">
        <div id="settings-setting-popup-p">
          <div id="settings-content-wrapper-p">
            <div id="setting-relative-container-p">
              <p id="settings-title-p">Settings</p>
              <img id="settings-close-button-p" src="./src/assets/dom/close.svg" alt="close" name="close"/>
            </div>

            <!-- scores -->
            <div id="settings-button-wrapper-p">
              <img id="settings-on-sound-button-p" src="./src/assets/art/SVG/settings/sound_on.svg" name="effects"/>
              <img id="settings-off-button-p" src="./src/assets/art/SVG/settings/sound_off.svg" name="effects"/>
              <!-- <img id="settings-on-sound-button-p" src="./sound_on.svg" />
              <img id="settings-off-button-p" src="./sound_off.svg" /> -->
              <button id="settings-howtoplay-buttons-p" name="howtoplay">
                How to play
              </button>
              <button id="settings-endgame-buttons-p" name="end game">
                End Game
              </button>
              <button id="settings-archive-buttons-p" name="archive">
                Archive
              </button>
              <p id="settings-version-text-p">v0.2.7</p>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script>
      // Function to toggle button visibility
      function toggleButtons() {
        var onButton = document.getElementById("settings-on-sound-button-p");
        var offButton = document.getElementById("settings-off-button-p");

        if (onButton.style.display === "none") {
          onButton.style.display = "block";
          offButton.style.display = "none";
        } else {
          onButton.style.display = "none";
          offButton.style.display = "block";
        }
      }
      var onButton = document.getElementById("settings-on-sound-button-p");
      var offButton = document.getElementById("settings-off-button-p");

      onButton.addEventListener("click", toggleButtons);
      offButton.addEventListener("click", toggleButtons);
      // function getClickEvent() {
      //   document.getElementById("settings-sound-button-p").style.display =
      //     "none";
      // }
      // window.addEventListener("click", getClickEvent);
      //  window.onload(()=> {
      // })
    </script>
  </body>
</html>
