    <style>
      *,
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      html {
        height: 100%;
      }
      body {
        /* background: #323352; */
        height: 100%;
      }
      /* #loader-container-p {
        display: flex;

      #progress-bar {
        border-radius: 20px;
        /* width: 100%; */
        width: 394px;
        height: 22px;
        box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
      }
      #progress-bar::-webkit-progress-bar {
        background-image: url("./src/assets/art/loading/loading_bar_BG_HA.png");
        background-repeat: no-repeat;
        background-size: cover;
        transition: all 0.5s ease-out;

      }
      #progress-bar::-webkit-progress-value {
        background: url("./src/assets/art/loading/loading_bar_HA_LH.png");
        background-repeat: no-repeat;
        background-size: cover;
      }
      #progress-bar::-moz-progress-bar {
        background-image: url("./loader-bg.png");
        background-repeat: no-repeat;
        background-size: cover;
      }
