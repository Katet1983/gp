<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width"
    />
    <title>Panel</title>
    <!-- <link href="landscpae.css" rel="stylesheet" /> -->
    <style>
      *,
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      html {
        height: 100%;
      }
      body {
        background: #051188;
        height: 100%;
      }
      *,
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      html {
        height: 100%;
      }
      body {
        background: #051188;
        height: 100%;
      }
      #panel-container-l {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      #panel-wrapper-l {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-size: contain;
        background-repeat: no-repeat;
        width: 700px;
        height: 494px;
      }
     
      #back-icon-howtoplay-l {
        width: 28px;
        height: 22px;
        margin: 32px 38px;
      }
      #close-icon-howtoplay-l {
        width: 25px;
        height: 25px;
        margin: 26px 34px;
        transition: all .2s ease-in-out;
        opacity: 0;
      }

      #close-icon-howtoplay-l:hover { transform: scale(1.1); }
      /* #parent-nav-p {
        width: 700px;
      } */
   
    
    #footer-nav-l{
        width: 100%;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
    }
        
    #container-nav-l{
        width: 34%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .arrowIcons-l{
      width: 68px;
        height: 68px;
    }
       
    #sliderIndicators-nav-l ul{
        display: inline-flex;
        padding: 0px;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }
    #sliderIndicators-nav-l ul li{
        list-style: none;
        margin: 0px 5px;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    #sliderIndicators-nav-l ul li img{
        width: 12px;
        height: 12px;
        opacity: 0.5;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      #left-arrow-l{
        opacity: 0.5;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      #panel-top-wrapper-p{
        display: flex;
        justify-content: space-between;
      }
      #right-arrow-l{
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <section id="panel-container-l">
      <div id="panel-wrapper-l">
        <div id="panel-top-wrapper-p">
          <div>
            <!-- <img
              id="back-icon-howtoplay-l"
              src="./assets/art/uiElements/backArrow_H.svg"
              alt="backbutton"
              name="back"
            /> -->
          </div>
          <div>
            <!-- for title text -->
            <p></p>
          </div>
          <div>
            <img
              id="close-icon-howtoplay-l"
              src="./src/assets/art/uiElements/close_P.svg"

              alt="closebutton"
              name="close"
            />
          </div>
        </div>
        
        <div id = "parent-nav-l">
          <div id = "footer-nav-l">
          <div id = "container-nav-l">      
              <div class = "arrowIcons-l" id="previousIcon">
                  <img id="left-arrow-l" src="./src/assets/tutorial/howToPlay_previous_active.svg" name ="left">
              </div>
              <div id = "sliderIndicators-nav-l">
                  <ul>
                      <li><img id="indicator-l-1" src="./src/assets/tutorial/howToPlay_selected_P.svg"></li>
                      <li><img id="indicator-l-2" src="./src/assets/tutorial/howToPlay_selected_P.svg"></li>
                      <li><img id="indicator-l-3" src="./src/assets/tutorial/howToPlay_selected_P.svg"></li>
                  </ul>
              </div>
              <div class = "arrowIcons-l" id="nextIcon">
                  <img id="right-arrow-l" src="./src/assets/tutorial/howToPlay_next_active.svg" name ="right">
              </div>
          </div> 
          </div>
      </div> 
      </div>
    </section>
  </body>
</html>
