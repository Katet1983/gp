<!DOCTYPE html>
<html lang="en">

<head>
    <!-- FONT_FAMILY_REGULAR: "MPLUSRou-Regular",
    FONT_FAMILY_MEDIUM: "MPLUSRou-Medium",
    FONT_FAMILY_EXTRABOLD: "MPLUSRou-ExtraBold",
    FONT_FAMILY_BOLD: "MPLUSRou-Bold", -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tutorial-l-c1 {
            width: 700px;
            height: 496px;
        }

        #container-l-c1 {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #container-l-c1 * {
            color: #323352;
        }

        /*********** header **************/
        #clodeIcon-L {
            width: 25px;
            height: 25px;
        }

        #backIcon-L {
            width: 28.5px;
            height: 28.5px;
        }

        .headerIcon-L img {
            width: 100%;
            height: 100%;
        }

        .heading-L {
            font-size: 40px;
            font-family: "MPLUSRou-Bold";
            color: #323352;
        }

        #header-l-c1 {
            visibility: hidden;
            width: 90%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 2%;
        }

        #polygonImg-l-c1 {
            width: 242px;
            height: 242px;
        }

        #polygonImg-l-c1 img {
            width: 100%;
            height: 100%;
        }

        #answerList-l-c1 li {
            list-style-type: none;
            font-family: "MPLUSRou-Medium";
        }

        #tutorialContent-l-c1 {
            display: flex;
            justify-content: space-around;
            /* margin-top: 3%; */
            margin-top: 0px;
        }

        #leftContent-l-c1 {
            flex-basis: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #rightContent-l-c1 {
            flex-basis: 45%;
        }

        #answerList-l-c1 {
            display: inline-flex;
        }

        #answerList-l-c1 li {
            font-size: 20px;
            margin: 0px 10px;
        }

        #currentInput-l-c1 {
            font-size: 41px;
            margin: 2px 0px;
            font-family: "MPLUSRou-ExtraBold";
        }

        #rightContent-l-c1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 35px;
        }

        #subTitle-l-c1 {
            font-size: 30px;
            font-family: "MPLUSRou-ExtraBold";
        }

        #content-l-c1 {
            /* width: 90%; */
            width: 100%;
            font-size: 18px;
            margin: 5px 0;
            font-family: "MPLUSRou-Medium";

        }
    </style>
</head>

<body>
    <!-- D:\polymatchC\assets\newArt\howToPlay_bg_L.svg -->
    <div id="tutorial-l-c1">
        <div id="container-l-c1">
            <!-- header -->
            <div id="header-l-c1">
                <div class="headerIcon-L" id="backIcon-L">
                    <img src="./src/assets/art/uiElements/backArrow_H.svg">
                    <!-- <img src="../art/uiElements/backArrow_H.svg"> -->
                </div>
                <div class="heading-L">How to Play</div>
                <div class="headerIcon-L" id="clodeIcon-L">
                    <img src="./src/assets/art/uiElements/close_H.svg">
                    <!-- <img src="../art/uiElements/close_H.svg"> -->

                </div>
            </div>

            <!-- tutorialContent -->
            <div id="tutorialContent-l-c1">
                <div id="leftContent-l-c1">
                    <!-- <div id="answerList"> -->
                    <ul id="answerList-l-c1">
                        <li>AUTO</li>
                        <li>OPERA</li>
                        <li>ACTOR</li>
                    </ul>
                    <div id="currentInput-l-c1">RURAL</div>
                    <div id="polygonImg-l-c1">
                        <img src="./src/assets/tutorial/howToPlay_img_03_P.png">

                        <!-- <img src="../newArt/howToPlay_img_01_L.svg"> -->
                    </div>
                    <!-- </div> -->
                </div>
                <div id="rightContent-l-c1">
                    <div id="subTitle-l-c1">
                        Objective
                    </div>
                    <div id="content-l-c1">
                        From words using all the letters on the polygon to complete the level.
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>


</html>
