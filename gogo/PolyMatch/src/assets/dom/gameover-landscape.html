<!DOCTYPE html>

    <title>Gameover</title>
    <!-- <link href="settings.css" rel="stylesheet" /> -->
    <style>



html,
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
}
html {
  height: 100%;
}
body {
  background: #323352;
  height: 100%;
}


#gameover-wrapper-popup-l {
  display: flex;
  align-items: center;
  height: 100%;
  min-height: 100%;
  justify-content: center;
  align-items: center;
  position: relative;
}
#gameover-setting-popup-l {
  background: url("../dom/settings_bg_P.svg"),linear-gradient( 50deg, #6fb6e1, #a1c1ca, #6fb6e1 100%);
  border-radius: 20px;
  /* background: url('./settings_bg_P.svg'); */
  width: 379px;
  height: 464px;
  background-repeat: no-repeat;
  background-size: contain;
}
#gameover-title-l {
  font-size: 36px;
  text-align: center;
  font-family: 'MPLUSRou-ExtraBold';
  margin: 0px;
  color: #323352;
}


#gameover-content-wrapper-l {
  padding: 20px 0px 20px 0px;
}
#gameover-scores-l {
  font-size: 105px;
    text-align: center;
    line-height: 106px;
    color: #fff;
    margin: 0;
    font-family: 'MPLUSRou-ExtraBold';
    height: 105px;
  
}
#gameover-words-title-l {
  font-size: 32px;
  text-align: center;
  color: #fff;
  margin: 0px;
  font-family: 'MPLUSRou-ExtraBold';

}
#gameover-words-wrapper-l {
  display: flex;
  justify-content: center;
  align-items: center;
}
#gameover-words-display-l {
  font-size: 16px;
  text-align: center;
  width: 250px;
  height: 82px;
  word-spacing: 20px;
  overflow-y: scroll !important;
  scroll-behavior: smooth;
  text-transform: uppercase;
  /* margin-top: 55px; */
  color: #323352;
  padding-right: 10px;
  font-family: "MPLUSRou-Medium";
}
#gameover-button-wrapper-l {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 30px;
}
#gameover-archive-buttons-l {
  height: 55px;
  border-radius: 30px;
  width: 140px;
  outline: none;
  border: none;
  background: #323251;
  color: #fff;
  margin: 0px 10px;
  font-size: 20px;
  font-family: 'MPLUSRou-ExtraBold';
  transition: background-color 0.3s;
}
#gameover-replay-buttons-l {
  height: 55px;
  border-radius: 30px;
  width: 140px;
  outline: none;
  border: none;
  background: #323251;
  color: #fff;
  margin: 0px 10px;
  font-size: 20px;
  font-family: 'MPLUSRou-ExtraBold';
  transition: background-color 0.3s;
}
#gameover-previousword-title-l{
  font-size: 20px;
  text-align: center;
  color: #fff;
  margin: 0px;
  font-family: 'MPLUSRou-ExtraBold';
  margin-bottom: 10px;
}
#gameover-wordscount-title-l{
  color:  #323352;
  font-size: 20px;
  font-family: 'MPLUSRou-ExtraBold';
  margin-left: 10px;
  margin-bottom: 10px;

}
#previous-word-l{
  display: flex;
    justify-content: center;
    align-items: baseline;
}
#gameover-replay-buttons-l:hover, #gameover-replay-buttons-l:focus, #gameover-replay-buttons-l:active {
  background: #2a2b45;
}
#gameover-archive-buttons-l:hover, #gameover-archive-buttons-l:focus, #gameover-archive-buttons-l:active {
  background: #2a2b45;
}
::-webkit-scrollbar {
  -webkit-appearance: none;
  width: 6px;
}

::-webkit-scrollbar-thumb {
  border-radius: 10px;
  background-color: #323251;
  -webkit-box-shadow: 0 0 1px rgba(255,255,255,.5);
}


    </style>
  </head>
  <body>
    <section id="gameover-wrapper-popup-l">
      <div id="gameover-wrapper-l">
        <div id="gameover-setting-popup-l">
          <!-- <img src="./settings_bg_P.svg" /> -->
          <div id="gameover-content-wrapper-l">
            <p id="gameover-title-l" id="gameOverTitle">Great Work!</p>
            <!-- scores -->
            <p id="gameover-scores-l">8</p>
            <p id="gameover-words-title-l">Words</p>
           <!-- words container -->
           <div id="previous-word-l">
            <p id="gameover-previousword-title-l">Previous Best : </p>
            <p id="gameover-wordscount-title-l">3 Words</p>
          </div>

            <div id="gameover-words-wrapper-l">
              <p id="gameover-words-display-l">
                Intensity Tipi Lite Intensity Tipi Lite Intensity Tipi Lite
                Intensity Tipi Lite Intensity Tipi Lite Intensity Tipi Lite
              </p>
            </div>
            <div id="gameover-button-wrapper-l">
              <button id="gameover-replay-buttons-l" name="replay">Replay</button>
              <button id="gameover-archive-buttons-l" name="archive">Archive</button>
            </div>
          </div>
        </div>
      </div>
    </section>
