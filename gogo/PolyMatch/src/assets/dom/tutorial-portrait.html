<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
      *{
        margin: 0px;
        padding: 0px;
        overflow: hidden;
      }

      body{
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* display: flex;
        align-items: center;
        justify-content: center; */
      }

      .tutorial-p{
        width: 468px;
        height: 887px;
        margin:  auto;
      }
    
      .containerT-p{
       
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        margin: auto;
      }

      /*********** header **************/
       #clodeIcon-p{
        width: 25px;
        height: 25px;
      }

      #backIcon-p{
        width: 28.5px;
        height: 28.5px;
      }
      
      .headerIcon-p img{
        width: 100%;
        height: 100%;
      }
      .header-p  .heading{
         font-size: 40px;
         font-family: "MPLUSRou-Bold";
         color: #323352;
      }
     
      .headerT-p{
        visibility: hidden;
        position: absolute;
        top: 2%;
        width: 90%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .leftContent-p
      .polygonImg{
        width: 348px;
        height: 348px;
      }
      .leftContent-p
      .polygonImg img{
        width: 100%;
        height: 100%;
      }  

    .leftContent-p
    .answerList li{
        list-style-type: none;
        font-family:  "MPLUSRou-Medium";

    }

    .tutorialContent-p{
        position: absolute;
        top: 10%;
        width: 90%;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
    }
    .leftContent-p{
        flex-basis: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .rightContent-p{
        flex-basis: 100%;
    }
    .leftContent-p
    .answerList{
         display: inline-flex;
    }
    .leftContent-p
    .answerList li{
        font-size: 20px;
        margin: 0px 10px;
    }
    .leftContent-p
    .currentInput{
        font-size: 41px;
        margin: 20px 0px;
        font-family: "MPLUSRou-ExtraBold";
    }
      
    .rightContent-p{
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 45px;
    }
    .rightContent-p{
    font-size: 30px;
    font-family: "MPLUSRou-ExtraBold";
    }

    #subTitle{
    font-size: 30px;
    font-family: "MPLUSRou-ExtraBold";
    }
    .rightContent-p{
     width: 90%;
     font-size: 21px;
     margin: 20px 0;
     font-family: "MPLUSRou-Bold";
     line-height: 25px;
    } 
    #content{
     width: 90%;
     font-size: 21px;
     margin: 20px 0;
     font-family: "MPLUSRou-Bold";
     line-height: 25px;
    } 

    </style>
</head>
<body>
    <!-- D:\polymatchC\assets\newArt\howToPlay_bg_L.svg -->
    <div class="tutorial-p">

                    <img src = "./assets/art/uiElements/backArrow_H.svg">

                <div class="heading">How to Play</div>
                <div class="headerIcon-p" id="clodeIcon-p">
                    <img src = "./assets/art/uiElements/close_P.svg">
                </div>
            </div>
             
            <!-- tutorialContent -->
            <div class="tutorialContent-p">
                <div class="leftContent-p">
                        <ul class="answerList">
                            <li>CITY</li>
                            <li>YARD</li>
                            <li>DEN</li>
                        </ul>
                        <div class="currentInput">NOTE</div>
                        <div class="polygonImg">
                            <img src="../tutorial/howToPlay_img_01_P.svg">
                        </div>
                </div>
                <div class="rightContent-p">
                    <div id="subTitle">
                        Objective
                    </div>
                    <div id="content">

                    </div>
                </div>
            </div>

        </div>
